<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #7F1D1D 0%, #4C0F0F 55%, #1A0E0E 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #FECACA; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #F87171; box-shadow: 0 0 18px #F87171; }
  h1 { font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#FCA5A5,#FDBA74); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #CBD5E1; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #FEE2E2; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(239,68,68,.30), transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Notifications</span></h1>
      <p class="sub">Persisted, brand-scoped notifications &mdash; types, per-type preferences, in-app, mail, and digests that do not repeat.</p>
      <div class="badges">
        <span class="badge">Types</span>
        <span class="badge">Preferences</span>
        <span class="badge">In-app</span>
        <span class="badge">Digests</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#EF4444"/><stop offset="1" stop-color="#F97316"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#450A0A" flood-opacity="0.32"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- bell -->
        <g filter="url(#sh)">
          <path d="M256 100 C198 100 151 147 151 205 V264 L120 316 C115 325 121 336 131 336 H381 C391 336 397 325 392 316 L361 264 V205 C361 147 314 100 256 100 Z" fill="#FFFFFF"/>
        </g>
        <path d="M214 356 H298 C298 379 279 398 256 398 C233 398 214 379 214 356 Z" fill="#FFFFFF"/>
        <circle cx="256" cy="80" r="21" fill="#FFFFFF"/>
        <!-- unread badge, cut out of the bell -->
        <circle cx="386" cy="134" r="60" fill="url(#bg)"/>
        <circle cx="386" cy="134" r="40" fill="#FFFFFF"/>
      </svg>
    </div>
  </div>
</body>
</html>
