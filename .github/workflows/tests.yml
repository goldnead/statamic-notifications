name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pest:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_sqlite, sqlite3, intl, fileinfo, gd
          coverage: none
          tools: composer:v2

      # goldnead/statamic-identity-contracts is private, so Composer needs a PAT
      # with read access configured as the SIBLING_REPOS_TOKEN secret.
      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.SIBLING_REPOS_TOKEN || github.token }}"}}'
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Show installed sibling versions
        run: composer show | grep -E 'goldnead|statamic/cms|laravel/framework'

      - name: Run Pest test suite
        run: vendor/bin/pest --colors=always
