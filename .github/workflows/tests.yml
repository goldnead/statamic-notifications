name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# goldnead/statamic-brand-context, -identity-contracts, -suppression and -leadhub
# are private, so Composer needs a PAT with read access on each of them,
# configured as the SIBLING_REPOS_TOKEN secret.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.SIBLING_REPOS_TOKEN || github.token }}"}}'

jobs:
  pest:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Laravel 11 is deliberately absent: statamic/cms ^6.0 requires
        # laravel/framework ^12.40 || ^13.0, and every v11 release up to
        # v11.55.0 is covered by security advisories Composer refuses to
        # install. PHP 8.2 is absent for the same reason — Laravel 12.40+
        # requires ^8.3. All eight combinations below were resolved with
        # `composer update --dry-run` before this file was committed.
        php: ['8.3', '8.4']
        laravel: ['^12.0', '^13.0']
        stability: [prefer-lowest, prefer-stable]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_sqlite, sqlite3, intl, fileinfo, gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-progress --no-interaction

      - name: Show installed sibling versions
        run: composer show | grep -E 'goldnead|statamic/cms|laravel/framework'

      - name: Run Pest test suite
        run: vendor/bin/pest --colors=always

  mysql:
    name: MySQL
    runs-on: ubuntu-latest

    # The one thing SQLite cannot see. v1.0.4 shipped an index MySQL refuses to
    # build (InnoDB's 3072-byte limit against utf8mb4) through a fully green
    # SQLite suite. README.md calls this run release-critical, so it belongs in
    # CI rather than in a release-day checklist nobody reads.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: notifications_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, mysqli, intl, fileinfo, gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run Pest against MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: notifications_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: vendor/bin/pest -c phpunit.mysql.xml --colors=always

  style:
    name: Code style and static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Check, never fix. Auto-committing style fixes onto a contributor's
      # branch rewrites their work without asking.
      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

# Der Job "standards" (addon-lint) lag hier und ist am 01.08.2026 entfernt worden.
# Er klonte das private goldnead/statamic-addon-studio ueber ein STUDIO_TOKEN-Secret.
# Ohne das Secret uebersprang er sich still bzw. scheiterte am Checkout -- also genau
# die Sorte Job, die gruen aussieht und nichts geprueft hat. addon-lint bleibt das
# zentrale Release-Gate im Studio (tools/verify-gate.sh faehrt es ueber alle Repos).
# Wieder hierher zurueck, sobald addon-lint als eigenes Paket auf Packagist liegt --
# dann braucht es kein Secret mehr.
